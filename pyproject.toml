[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "novar"
version = "0.1.0"
description = "Novare 智能科研平台 — LangChain/LangGraph 重构工作区"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0",
    "httpx>=0.27",
    "pymupdf4llm>=0.0",
    "networkx>=3.0",
    "numpy>=1.26",
    "python-dotenv>=1.0",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "asyncpg>=0.30",
    "aiosqlite>=0.20",
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7",
    "pymilvus>=2.4",
    "docker>=7.0",
    # 多渠道接入依赖
    "pycryptodome>=3.20",
    "qrcode>=7.0",
    # Redis（可选，分布式锁 / 消息去重）
    "redis>=5",
    # ── LangChain / LangGraph 运行时 ──
    "langgraph>=0.4",
    "langchain-core>=0.3",
    "langchain-openai>=0.3",
    "langchain>=0.3",
]

[project.optional-dependencies]
openai = ["openai>=1.0"]
local-embed = ["sentence-transformers>=2.0"]
all = ["openai>=1.0", "sentence-transformers>=2.0"]

[tool.hatch.build.targets.wheel]
packages = ["novare"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
