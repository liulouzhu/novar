[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "research-agent"
version = "0.1.0"
description = "科研智能体 MCP Server - 论文检索、解析、RAG、知识图谱、代码执行"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0",
    "httpx>=0.27",
    "pymupdf4llm>=0.0",
    "networkx>=3.0",
    "numpy>=1.26",
    "pymilvus>=2.4",
    "elasticsearch[async]>=8.12,<9",
    "sqlalchemy>=2.0",
    "asyncpg>=0.30",
    "aiosqlite>=0.20",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
openai = ["openai>=1.0"]
local-embed = ["sentence-transformers>=2.0"]
all = ["openai>=1.0", "sentence-transformers>=2.0"]

[tool.hatch.build.targets.wheel]
packages = ["."]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
]
